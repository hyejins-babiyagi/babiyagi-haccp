<style>

@media print{nav,header .sub,.noprint{display:none!important;}body{background:#fff;}.card{border:none;padding:0;}.wrap{margin:0;max-width:none;}
  .pagebreak{page-break-before:always;break-before:page;}
  table{page-break-inside:auto;} tr{page-break-inside:avoid;} thead{display:table-header-group;}}

<body>
<header>
  <div><h1>바비야기 HACCP 보고 자동화</h1><div class="sub">엑셀 없이 브라우저에서 — 판매 업로드 · 수기 입력 · 보고서 출력</div></div>

<script>
"use strict";
const CANON=["채수팩","요리한끗","생강비책","순맛된장","순맛간장","순한배추김치","순한깍두기","순한백김치","순한빨간장","아기첫물","순한고기양념장","순한나박김치"];
const KIM4=["순한배추김치","순한깍두기","순한백김치","순한나박김치"];
const KW=[["채수팩","채수팩"],["유기농채수","채수팩"],["유기농 채수","채수팩"],["순한채수","채수팩"],["아기채수","채수팩"],["바비야기채수","채수팩"],["채수","채수팩"],["요리한끗","요리한끗"],["생강비책","생강비책"],["고기양념장","순한고기양념장"],["빨간장","순한빨간장"],["순쌀된장","순맛된장"],["순맛된장","순맛된장"],["된장","순맛된장"],["저당맛간장","순맛간장"],["저염맛간장","순맛간장"],["순맛간장","순맛간장"],["맛간장","순맛간장"],["간장","순맛간장"],["배추김치","순한배추김치"],["깍두기","순한깍두기"],["백김치","순한백김치"],["나박김치","순한나박김치"],["아기첫물","아기첫물"],["첫물","아기첫물"]];
const NONPROD=["아이스팩","비품","포장","보냉","택배비","배송비","소분용기","용기","보냉백","쇼핑백","스티커","봉투"];
function kwFirst(s){for(const[k,p]of KW){if(s.includes(k))return p;}return null;}
function resolveOpt(opt){
  const res={}; const add=(p,n)=>{res[p]=(res[p]||0)+n;};
  const tail = opt.includes(":")? opt.split(":").slice(1).join(":").trim() : opt;
  if(/소분용기|용기|보냉백|보냉가방|쇼핑백|아이스팩|스티커|봉투|포장비닐/.test(opt)) return {products:{},note:"제외(비품)"};
  if(NONPROD.some(k=>opt.includes(k)) && !kwFirst(opt)) return {products:{},note:"제외(비품)"};
  if(/4\s*종\s*set/i.test(opt)||opt.includes("김치4종")||opt.includes("유아김치4종")){
    KIM4.forEach(p=>add(p,1));
    opt.split(/[,，]/).forEach(part=>{if(part.includes("4종"))return;const p=kwFirst(part);if(p)add(p,1);});
    return {products:res,note:"확인필요:4종set"};
  }
  let mult=1,extra=0,m;
  if(m=tail.match(/(\d+)\s*팩\s*(?:세트|셋트|set|SET|Set)?/))mult=+m[1];   // 3팩세트/3팩SET/3팩
  if(m=tail.match(/(\d+)\s*(?:책|개|통|병)\s*(?:세트|셋트|set|SET|Set)/))mult=+m[1]; // 3책SET(오타) 등
  if(m=tail.match(/(\d+)\s*박스/))mult=+m[1];
  const re=/\+\s*(\d+)\s*팩/g; while(m=re.exec(tail))extra+=+m[1];
  if(mult>1||extra>0){const p=kwFirst(tail)||kwFirst(opt);if(p)add(p,mult+extra);return {products:res,note:(mult+extra>1?"확인필요:수량x"+(mult+extra):"")};}
  if(tail.includes("+")){tail.split("+").forEach(part=>{const p=kwFirst(part);if(p)add(p,1);});if(Object.keys(res).length)return {products:res,note:"확인필요:복수구성"};}
  const p=kwFirst(tail)||kwFirst(opt); if(p)return {products:{[p]:1},note:""};
  return {products:{},note:"확인필요:매칭불가"};
}
// ---------- 배합비(제품별 제조 함량표, 기준생산량 kg 기준) ----------
const RECIPE_VER=3; // 함량표 수정 시 +1 (기존 사용자 앱도 기본값 갱신)
const RECIPES_DEFAULT={
 "순맛간장":{batch:34,ing:{"간장":20,"무":2,"대파":2,"양파":2,"사과":4,"배추":3,"건표고":0.1,"감초":0.1,"생강":0.16,"다진마늘":0.6}},
 "순한김치베이스":{batch:22,ing:{"쌀풀":10,"매실액":0.8,"멸치액젓":0.6,"다진마늘":0.5,"양파":4,"사과":6}},
 "순맛된장":{batch:27,ing:{"백태":10,"미네랄소금":3,"채수":6,"콩삶은물":2,"쌀누룩가루":4,"메주가루":2}},
 "순한빨간장":{batch:15,ing:{"매실":3,"소금":0.7,"채수":5,"쌀누룩":0.4,"메주가루":0.85,"안매운":0.8,"파프리카":1.7,"조청":2}},
 "생강비책":{batch:15,ing:{"생강즙":8,"유기원당":4,"유기조청":3}},
 "순한고기양념장":{batch:17.5,ing:{"양념장베이스":6,"도라지":0.5,"배":5,"채수":6}},
 "순한배추김치":{batch:9.7,ing:{"절인배추":5,"파프리카가루":0.2,"김치베이스":2,"채수":2.5}},
 "순한깍두기":{batch:9.7,ing:{"절인무":5,"파프리카가루":0.2,"김치베이스":2,"채수":2.5}},
 "순한백김치":{batch:14,ing:{"절인배추":3,"절인무":2,"김치베이스":3,"채수":6}},
 "순한나박김치":{batch:19,ing:{"절인배추":3,"절인무":2,"오이":1,"당근":1,"김치베이스":4,"채수":8}}
};
// 전처리 수율: 가공재료 -> 원재료 환산(수율) & 폐기. (배추 절임 20%감소, 무 절임 10%, 파프리카 건조 92%)
const PROCESS_YIELD={"절인배추":{raw:"배추",yield:0.8},"절인무":{raw:"무",yield:0.9},"파프리카가루":{raw:"파프리카",yield:0.08}};
const NO_RECIPE_NOTE=["채수팩","요리한끗","아기첫물"];
// ---------- 상태 ----------
const KEY="babiyagi_haccp_v1";
let ST={sales:[],production:[],purchases:[],inspections:[],wastes:[],optionMap:{},reviews:[],recipes:null};
function load(){try{const j=localStorage.getItem(KEY);if(j)ST=Object.assign(ST,JSON.parse(j));}catch(e){}
  if(!ST.inspections)ST.inspections=[];
  if(!ST.wastes)ST.wastes=[];
  if(!ST.recipes || ST.recipeVer!==RECIPE_VER){ST.recipes=JSON.parse(JSON.stringify(RECIPES_DEFAULT));ST.recipeVer=RECIPE_VER;save();}
}
// 1회 생산(product, kg)의 원재료 사용량 (전처리 수율로 원재료 환산)
function recipeUsage(product,kg){
  const rc=(ST.recipes||{})[product]; const use={}; kg=num(kg);
  if(!rc||!kg||!rc.batch)return use;
  const f=kg/rc.batch;
  for(const ing in rc.ing){ const amt=rc.ing[ing]*f; const pc=PROCESS_YIELD[ing];
    if(pc){ use[pc.raw]=(use[pc.raw]||0)+amt/pc.yield; } else { use[ing]=(use[ing]||0)+amt; } }
  return use;
}
// 1회 생산의 폐기량(전처리 손실) — 원재료별
function recipeWaste(product,kg){
  const rc=(ST.recipes||{})[product]; const w={}; kg=num(kg);
  if(!rc||!kg||!rc.batch)return w;
  const f=kg/rc.batch;
  for(const ing in rc.ing){ const pc=PROCESS_YIELD[ing]; if(pc){ const amt=rc.ing[ing]*f; w[pc.raw]=(w[pc.raw]||0)+(amt/pc.yield-amt); } }
  return w;
}
// 생산기록 1건의 실제 원물 사용량(저장된 라인 우선) — 전처리 수율 환산 포함
function prodUsage(p){
  const use={}; const ls=(p.lines&&p.lines.length)?p.lines:null;
  if(ls){ ls.forEach(l=>{ if(!l.mat)return; const amt=num(l.kg); const pc=PROCESS_YIELD[l.mat];
      if(pc)use[pc.raw]=(use[pc.raw]||0)+amt/pc.yield; else use[l.mat]=(use[l.mat]||0)+amt; }); return use; }
  return recipeUsage(p.product,p.prodKg);
}
function prodWaste(p){
  const w={}; const ls=(p.lines&&p.lines.length)?p.lines:null;
  if(ls){ ls.forEach(l=>{ const pc=PROCESS_YIELD[l.mat]; if(pc){const amt=num(l.kg); w[pc.raw]=(w[pc.raw]||0)+(amt/pc.yield-amt);} }); return w; }
  return recipeWaste(p.product,p.prodKg);
}
function usageByMaterial(filterFn){
  const use={};
  (ST.production||[]).forEach(p=>{ if(filterFn&&!filterFn(p.date))return; const u=prodUsage(p); for(const m in u)use[m]=(use[m]||0)+u[m]; });
  (ST.purchases||[]).forEach(p=>{ if(filterFn&&!filterFn(p.date))return; if(num(p.useKg))use[p.material]=(use[p.material]||0)+num(p.useKg); });
  return use;
}
function wasteByMaterial(filterFn){
  const w={};
  (ST.production||[]).forEach(p=>{ if(filterFn&&!filterFn(p.date))return; const u=prodWaste(p); for(const m in u)w[m]=(w[m]||0)+u[m]; });
  return w;
}
// 중간재료 별칭(생산 품목명 -> 원물명). 이름이 같으면 자동 연결됨.
const INTER_ALIAS={"순한김치베이스":"김치베이스"};
function interName(product){return INTER_ALIAS[product]||product;}
// 자체생산으로 재고에 가산할 중간재료만 (완제품 CANON은 판매로 차감하므로 제외)
function madeByMaterial(filterFn){
  const made={};
  const usedNames=new Set();
  (ST.production||[]).forEach(p=>{(p.lines||prodLines(p)||[]).forEach(l=>{if(l&&l.mat)usedNames.add(l.mat);});});
  (ST.production||[]).forEach(p=>{
    if(filterFn&&!filterFn(p.date))return;
    const nm=interName(p.product);
    if(CANON.indexOf(nm)>=0)return;                 // 완제품 제외
    if(usedNames.has(nm)&&num(p.prodKg))made[nm]=(made[nm]||0)+num(p.prodKg);
  });
  return made;
}
// 원료별 입고량 (육안검사 중량 + 레거시 매입 inKg + 중간재료 자체생산)
function inByMaterial(filterFn){
  const inn={};
  (ST.inspections||[]).forEach(x=>{ if(filterFn&&!filterFn(x.date))return; if(num(x.weight))inn[x.item]=(inn[x.item]||0)+num(x.weight); });
  (ST.purchases||[]).forEach(p=>{ if(filterFn&&!filterFn(p.date))return; if(num(p.inKg))inn[p.material]=(inn[p.material]||0)+num(p.inKg); });
  const made=madeByMaterial(filterFn);
  for(const m in made)inn[m]=(inn[m]||0)+made[m];
  return inn;
}
function save(){localStorage.setItem(KEY,JSON.stringify(ST));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtDate(d){
  if(d===null||d===undefined||d==="")return"";
  if(d && typeof d==="object" && typeof d.getTime==="function" && !isNaN(d.getTime()))
    return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(typeof d==="number"||/^\d+(\.\d+)?$/.test(String(d))){ // 엑셀 날짜 시리얼
    const n=parseFloat(d);
    if(n>20000&&n<80000){const dt=new Date(Math.round((n-25569)*86400*1000));return dt.toISOString().slice(0,10);}
  }
  const s=String(d);const m=s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if(m)return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
  return s.slice(0,10);
}
// ---------- 복호화 (ECMA-376 agile) ----------
function H(){const h=sha512.create();for(const b of arguments)h.update(b);return new Uint8Array(h.arrayBuffer());}
function le32(n){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n>>>0,true);return b;}
function concat(a,b){const c=new Uint8Array(a.length+b.length);c.set(a,0);c.set(b,a.length);return c;}
function u16le(s){const b=new Uint8Array(s.length*2);for(let i=0;i<s.length;i++)new DataView(b.buffer).setUint16(i*2,s.charCodeAt(i),true);return b;}
function aesCbcDec(key,iv,data){const cbc=new aesjs.ModeOfOperation.cbc(key,iv);return cbc.decrypt(data);}
function decryptXlsx(buf,password){
  const cfb=XLSX.CFB.read(new Uint8Array(buf),{type:"array"});
  const find=n=>{const e=XLSX.CFB.find(cfb,n);return e?new Uint8Array(e.content):null;};
  const info=find("EncryptionInfo"); if(!info) return new Uint8Array(buf); // 암호화 아님
  const pkg=find("EncryptedPackage");
  const xml=new TextDecoder().decode(info.slice(8));
  const A=(f,a)=>{const m=f.match(new RegExp(a+'="([^"]*)"'));return m?m[1]:null;};
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const kdF=xml.match(/<keyData[^>]*\/?>/)[0], ekF=xml.match(/<(?:p:)?encryptedKey[^>]*\/?>/)[0];
  const kdSalt=b64(A(kdF,"saltValue")), kdBlock=+A(kdF,"blockSize");
  const spin=+A(ekF,"spinCount"), ekSalt=b64(A(ekF,"saltValue")), keyBits=+A(ekF,"keyBits"), ekBlock=+A(ekF,"blockSize"), ekv=b64(A(ekF,"encryptedKeyValue"));
  let h=H(ekSalt,u16le(password));
  for(let i=0;i<spin;i++)h=H(le32(i),h);
  const key=H(h,new Uint8Array([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6])).slice(0,keyBits/8);
  const secret=aesCbcDec(key,ekSalt.slice(0,ekBlock),ekv);
  const total=new DataView(pkg.buffer,pkg.byteOffset,8).getUint32(0,true);
  let out=new Uint8Array(0),pos=8,seg=0;
  while(pos<pkg.length){const iv=H(kdSalt,le32(seg)).slice(0,kdBlock);out=concat(out,aesCbcDec(secret,iv,pkg.slice(pos,pos+4096)));pos+=4096;seg++;}
  return out.slice(0,total);
}
// ---------- 파일 파싱 ----------
function aoaFirstSheet(data){const wb=XLSX.read(data,{type:"array",cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});}
function isJasamol(rows){const h=(rows[0]||[]).map(String);return h.includes("판매채널")&&h.includes("옵션명");}
// 스마트스토어 '주문조회' 양식(헤더 있음) 판별

function parseOrderQuery(rows,fkey){

    const qty=(+row[iQty])||1, name=String(row[iNm]||""), ordno=row[iOrd], spo=row[iSpo];
    if(ordno==null||ordno===""){   // 수기 추가분

    }else{

function parseJasamol(rows){
  const h=rows[0].map(String); const gi=(n,d)=>{const i=h.indexOf(n);return i<0?d:i;};
  const iO=gi("주문번호",1),iSeg=gi("주문섹션품목번호",15),iQ=gi("구매수량",16),iPn=gi("상품명",17),iOpt=gi("옵션명",18),iNm=gi("주문자 이름",8),iDt=gi("주문일",37);
  const items=[];
  for(let r=1;r<rows.length;r++){const row=rows[r];if(!row[iO]&&row[iO]!==0)continue;const opt=row[iOpt];if(!opt)continue;
    const seg=String(row[iSeg]||"").replace(/\D/g,"")||String(row[iO]).replace(/\D/g,"");
    items.push({spo:seg,ordno:String(row[iO]),date:fmtDate(row[iDt]),channel:"자사몰",opt:String(opt).trim(),qty:(+row[iQ]||1),name:String(row[iNm]||"")});}

}
function parseSmartstore(rows,fkey){
  const items=[];let cur=null,midx=0,mline=0;
  for(let r=0;r<rows.length;r++){const row=rows[r];const opt=row[20];if(!opt)continue;
    const ordno=row[1],dt=row[11],qty=(+row[15]||1),name=String(row[7]||"");
    if(ordno===""||ordno==null){if(cur!==name){midx++;cur=name;}mline++;
      items.push({spo:"99"+fkey+String(mline).padStart(4,"0"),ordno:"M"+fkey+"-"+String(midx).padStart(2,"0"),date:fkey.slice(0,4)+"-"+fkey.slice(4,6)+"-"+fkey.slice(6,8),channel:"스마트스토어",opt:String(opt).trim(),qty,name,manual:true});}
    else{items.push({spo:String(row[0]),ordno:String(ordno),date:fmtDate(dt),channel:"스마트스토어",opt:String(opt).trim(),qty,name});}}

}
function dateKeyFromName(fn){
  let m=fn.match(/(20\d{2})[.\-_]?(\d{2})[.\-_]?(\d{2})/); if(m)return m[1]+m[2]+m[3];
  m=fn.match(/(20\d{2})[.\-_](\d{1,2})(?!\d)/); if(m)return m[1]+String(m[2]).padStart(2,"0")+"01"; // 2026.01 → 20260101
  return new Date().toISOString().slice(0,10).replace(/-/g,"");
}

const $=s=>document.querySelector(s); const app=$("#app");

function existingSpo(){return new Set(ST.sales.map(s=>s.spo));}
function buyerType(name){return (name&&String(name).includes("점"))?"도매":"소매";}
function num(v){return (typeof v==="number")?v:(parseFloat(v)||0);}

function looksEncrypted(data){try{const cfb=XLSX.CFB.read(data,{type:"array"});return !!XLSX.CFB.find(cfb,"EncryptionInfo");}catch(e){return false;}}

async function processFiles(files,password){
  const seen=existingSpo(); let added=0,dup=0,fileN=0; const newReviews=[];
  for(const file of files){
    if(!/\.xlsx?$/i.test(file.name))continue;
    let data=new Uint8Array(await file.arrayBuffer());
    if(looksEncrypted(data)){
      if(!password){throw new Error("암호화된 파일입니다. 비밀번호를 입력하세요: "+file.name);}
      try{data=decryptXlsx(data,password);}catch(e){throw new Error("복호화 실패(비밀번호 확인): "+file.name);}
    }
    const rows=aoaFirstSheet(data); const fkey=dateKeyFromName(file.name);
    const items=isJasamol(rows)?parseJasamol(rows):(isOrderQuery(rows)?parseOrderQuery(rows,fkey):parseSmartstore(rows,fkey));
    for(const it of items){
      if(seen.has(it.spo)){dup++;continue;} seen.add(it.spo);
      let pr,note;
      if(ST.optionMap[it.opt]){pr=ST.optionMap[it.opt];note="";}
      else{const r=resolveOpt(it.opt);pr=r.products;note=r.note;ST.optionMap[it.opt]=pr;if(note.startsWith("확인필요")){newReviews.push({opt:it.opt,note,products:pr});}}
      const products={}; for(const p in pr){products[p]=(products[p]||0)+pr[p]*it.qty;}
      ST.sales.push({spo:it.spo,ordno:it.ordno,date:it.date,channel:it.channel,type:buyerType(it.name),buyer:it.name,opt:it.opt,qty:it.qty,products,manual:!!it.manual});
      added++;
    }
    fileN++;
  }
  const allRev=(ST.reviews||[]).concat(newReviews); const seenO=new Set();
  ST.reviews=allRev.filter(r=>{if(seenO.has(r.opt))return false;seenO.add(r.opt);return true;}); save();
  return {added,dup,fileN,newReviews};
}

let inspDraft=[], inspOcrText="";
function parseReceipt(text){
  const rows=[]; let d="";
  const dm=text.match(/(20\d{2})[.\-\/ ]\s*(\d{1,2})[.\-\/ ]\s*(\d{1,2})/);
  if(dm)d=dm[1]+"-"+String(dm[2]).padStart(2,"0")+"-"+String(dm[3]).padStart(2,"0");
  text.split(/\n/).forEach(line=>{
    line=line.trim(); if(line.length<2)return;
    if(/합계|소계|총액|총금액|금액|부가세|공급가|카드|현금|결제|배송|할인|포인트|주문번호|구매내역|사업자|영수증|승인|계좌|은행|적립/.test(line))return;
    const nm=line.match(/(\d+(?:[.,]\d+)?)\s*(kg|킬로|g|개|박스|통|병)?/i);
    const namePart=line.replace(/[\d.,]+\s*(kg|킬로|g|개|박스|통|병)?/ig,"").replace(/[₩원:|()\[\]]/g,"").trim();
    if(nm && namePart.length>=1 && /[가-힣]/.test(namePart))
      rows.push({date:d,item:namePart.slice(0,24),weight:parseFloat(String(nm[1]).replace(",","."))||"",source:""});
  });
  return rows;
}

function buildReport(){
  const m=RMONTH; const inM=d=>d&&d.slice(0,7)===m; const beforeM=d=>d&&String(d).slice(0,10)<m+"-01";
  const sales=ST.sales.filter(s=>inM(s.date));

  // 원료수불: 기초(전월말) + 당월 입고(육안검사) - 당월 사용(생산×배합비)

  const mats=[...new Set([].concat(Object.keys(inBefore),Object.keys(useBefore),Object.keys(inNow),Object.keys(useNow)))].sort();
  const matRows=mats.map(mat=>{const open=(inBefore[mat]||0)-(useBefore[mat]||0);const made=madeNow[mat]||0;const ins=(inNow[mat]||0)-made;const use=useNow[mat]||0;return {mat,open,ins,made,use,close:open+ins+made-use};}).filter(r=>r.open||r.ins||r.made||r.use);
  // 폐기 물량(전처리 손실)
  const waste=wasteByMaterial(inM); const wasteRows=Object.entries(waste).filter(([mm,v])=>v>0.001).sort();
  const today=new Date().toISOString().slice(0,10);
  const tbl=(head,body)=>`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  const f1=x=>(Math.round(x*100)/100);
  const wst=((ST.wastes||[]).filter(x=>inM(x.date))).sort((a,b)=>a.date<b.date?-1:1);
  // 일별 정합성 점검: 생산일에 폐기 대장이 있는지 / 사용 원료가 입고(육안검사)에 있는지
  const prodDays=[...new Set(prod.map(p=>p.date))].sort();
  const wasteDays=new Set(wst.map(w=>w.date));
  const needWaste=prodDays.filter(d=>{const s=Object.values(wasteByMaterial(x=>x===d)).reduce((a,v)=>a+v,0);return s>0.001&&!wasteDays.has(d);});
  const negMats=matRows.filter(r=>r.close<-0.001).map(r=>r.mat);
  const head=(title)=>`
  <div class="card">
    <div style="text-align:center;margin-bottom:6px"><div style="font-size:19px;font-weight:800">${title}</div>
    <div class="muted">바비야기 &nbsp;·&nbsp; 대상 기간: ${m} &nbsp;·&nbsp; 작성일: ${today}</div>
    <div class="muted" style="margin-top:4px">작성자: ____________ &nbsp;&nbsp; 승인자: ____________</div></div>
  </div>`;
  const check=`
  <div class="card noprint"><h2>정합성 점검 <span class="pill">일별 대조</span></h2>
    ${(needWaste.length||negMats.length)?`<div class="warn">
      ${needWaste.length?`· <b>폐기물 대장 누락일 ${needWaste.length}일</b>: ${needWaste.join(", ")} → ④폐기물 반출 탭에서 추가하세요.<br>`:""}
      ${negMats.length?`· <b>입고 기록이 부족한 원료</b>: ${negMats.join(", ")} → ③육안검사·입고 탭에서 입고를 기록하세요(기말재고 음수).`:""}
    </div>`:`<div class="ok">생산일·폐기물·입고 기록이 서로 맞습니다. 👍</div>`}
  </div>`;
  const S={};
  S.prod=`<div class="card"><h2>생산일지</h2>
    ${prod.length?tbl(`<tr><th>날짜</th><th class="l">품목</th><th>중량(kg)</th><th class="l">원물명</th><th>중량(kg)</th><th>가열℃</th><th>염도%</th><th>금속</th></tr>`,
      prod.map(r=>{const ls=prodLines(r);
        if(!ls.length)return `<tr><td>${r.date}</td><td class="l">${esc(r.product)}</td><td>${r.prodKg||""}</td><td class="l" colspan=2>-</td><td>${r.heat||""}</td><td>${r.salt||""}</td><td>${r.metal||""}</td></tr>`;
        return ls.map((l,i)=>`<tr><td>${r.date}</td><td class="l">${esc(r.product)}</td><td style="color:#b03030;font-weight:${i===0?700:400}">${i===0?(r.prodKg||""):"-"}</td><td class="l">${esc(l.mat)}</td><td>${l.kg}</td><td>${i===0?(r.heat||""):""}</td><td>${i===0?(r.salt||""):""}</td><td>${i===0?(r.metal||""):""}</td></tr>`).join("");
      }).join("")):`<p class="muted">해당 월 생산 기록이 없습니다. ②생산일지 탭에서 입력하세요.</p>`}
  </div>`;
  S.waste=`<div class="card"><h2>폐기물 반출(배출) 관리대장</h2>
    ${wst.length?tbl(`<tr><th>순</th><th>반출일</th><th>폐기물 종류</th><th class="l">폐기물구분</th><th>배출량(kg/L)</th><th>배출방법</th><th>작성자</th><th>수거업체</th><th class="l">기타사항</th></tr>`,
      wst.map((r,i)=>`<tr><td>${i+1}</td><td>${r.date}</td><td>${r.kind||""}</td><td class="l">${esc(r.wtype||"")}</td><td>${num(r.amount)||""}</td><td>${r.way||""}</td><td>${esc(r.by||"")}</td><td>${esc(r.company||"")}</td><td class="l">${esc(r.note||"")}</td></tr>`).join("")+
      `<tr style="background:#f0f2f5;font-weight:700"><td colspan=4 class="l">합계</td><td>${f1(wst.reduce((a,r)=>a+num(r.amount),0))}</td><td colspan=4></td></tr>`):`<p class="muted">해당 월 폐기물 반출 기록이 없습니다. ④폐기물 반출 탭에서 입력하세요.</p>`}
  </div>`;
  S.insp=`<div class="card"><h2>육안검사일지 (원료 입고 검사)</h2>
    ${insp.length?tbl(`<tr><th>일자</th><th class="l">품명</th><th>중량</th><th class="l">입고처</th><th>성적서<br>구비여부</th><th>소비기한</th><th>차량상태</th><th>성상</th><th>이물혼입</th><th>표시기준</th><th>적합여부</th><th class="l">부적합시<br>조치내용</th></tr>`,
      insp.map(r=>`<tr><td>${r.date}</td><td class="l">${esc(r.item)}</td><td>${num(r.weight)||""}</td><td class="l">${esc(r.source||"")}</td><td>${r.cert||""}</td><td>${esc(r.expiry||"")}</td><td>${r.carState||""}</td><td>${r.appearance||""}</td><td>${r.foreign||""}</td><td>${r.labeling||""}</td><td style="${r.result==="부적합"?"color:var(--warn);font-weight:700":""}">${r.result||""}</td><td class="l">${esc(r.action||"")}</td></tr>`).join("")):`<p class="muted">해당 월 육안검사(입고) 기록이 없습니다. ③탭에서 입력하세요.</p>`}
  </div>`;
  S.mat=`<div class="card"><h2>원료수불부</h2>
    ${matRows.length?tbl(`<tr><th class="l">원료</th><th>기초재고</th><th>입고</th><th>자체생산</th><th>사용</th><th>기말재고</th></tr>`,
      matRows.map(r=>`<tr><td class="l">${esc(r.mat)}</td><td>${f1(r.open)}</td><td>${f1(r.ins)}</td><td>${r.made?f1(r.made):""}</td><td>${f1(r.use)}</td><td style="${r.close<-0.001?"color:var(--warn);font-weight:700":"font-weight:700"}">${f1(r.close)}</td></tr>`).join("")):`<p class="muted">해당 월 원료 수불 기록이 없습니다.</p>`}
    <p class="muted" style="margin-top:8px">단위: kg · <b>입고</b>=육안검사일지 기록 · <b>자체생산</b>=중간재료(김치베이스 등) 생산량 · <b>사용</b>=생산일지 원물 사용량(절임·건조 손실 환산 포함)</p>
  </div>
  <div class="card noprint"><h2>[참고] 제품별 판매현황</h2>
    ${tbl(`<tr><th class="l">제품</th><th>소매</th><th>도매</th><th>합계</th></tr>`,
      CANON.map(p=>`<tr><td class="l">${p}</td><td>${sumP[p].소매||""}</td><td>${sumP[p].도매||""}</td><td><b>${(sumP[p].소매+sumP[p].도매)||""}</b></td></tr>`).join("")+
      `<tr style="background:#f0f2f5;font-weight:700"><td class="l">합계</td><td>${CANON.reduce((a,p)=>a+sumP[p].소매,0)}</td><td>${CANON.reduce((a,p)=>a+sumP[p].도매,0)}</td><td>${CANON.reduce((a,p)=>a+sumP[p].소매+sumP[p].도매,0)}</td></tr>`)}
    <p class="muted" style="margin-top:10px">주문 ${orderCnt}건 · 판매라인 ${sales.length}건${wasteRows.length?" · 전처리 손실: "+wasteRows.map(([mm,v])=>mm+" "+f1(v)+"kg").join(" · "):""}</p>
  </div>`;
  const TITLE={prod:"생산일지",waste:"폐기물 반출(배출) 관리대장",insp:"육안검사일지",mat:"원료수불부"};
  let html;
  if(RTAB==="all"){
    html=head("HACCP 월간 보고서 (4종)")+check+
      ["prod","waste","insp","mat"].map((k,i)=>`<div class="${i>0?"pagebreak":""}">${S[k]}</div>`).join("");
  }else{
    html=head(TITLE[RTAB])+check+S[RTAB];
  }
  $("#reportArea").innerHTML=html;
}
function renderData(){
  app.innerHTML=`
  <div class="card"><h2>데이터 관리</h2>
    <p>모든 데이터는 이 브라우저에 저장됩니다. 정기적으로 <b>백업파일</b>을 받아두세요(PC 이전·복구용).</p>
    <p class="muted">판매 ${ST.sales.length}건 · 생산 ${(ST.production||[]).length}건 · 육안검사 ${(ST.inspections||[]).length}건 · 폐기물 ${(ST.wastes||[]).length}건 · 옵션 ${Object.keys(ST.optionMap).length}종</p>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="d_exp">💾 백업파일 내려받기 (JSON)</button>
      <button class="btn outline" id="d_imp">📥 백업파일 불러오기</button>
      <input type="file" id="d_impf" accept=".json" hidden>
      <button class="btn gray" id="d_clr">전체 삭제</button>
    </div>
    <div id="d_msg"></div>
  </div>
  <div class="card"><h2>옵션 매핑 (${Object.keys(ST.optionMap).length})</h2>
    <p class="muted">옵션 → 제품 환산 사전입니다. 잘못된 매핑이 있으면 알려주세요(다음 버전에서 편집 기능 추가).</p>
    <table><thead><tr><th class="l">옵션</th><th class="l">제품 환산</th></tr></thead><tbody>
    ${Object.entries(ST.optionMap).slice(0,200).map(([o,p])=>`<tr><td class="l">${o}</td><td class="l">${Object.entries(p).map(([k,v])=>k+"×"+v).join(", ")||'<span style="color:var(--warn)">(없음)</span>'}</td></tr>`).join("")}
    </tbody></table>
  </div>`;
  $("#d_exp").onclick=()=>{const blob=new Blob([JSON.stringify(ST,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="바비야기HACCP백업_"+new Date().toISOString().slice(0,10)+".json";a.click();};
  $("#d_imp").onclick=()=>$("#d_impf").click();
  $("#d_impf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());ST=Object.assign({sales:[],production:[],purchases:[],inspections:[],wastes:[],optionMap:{},reviews:[],recipes:JSON.parse(JSON.stringify(RECIPES_DEFAULT))},j);save();$("#d_msg").innerHTML=`<div class="ok">불러오기 완료</div>`;setTimeout(renderData,800);}catch(e){$("#d_msg").innerHTML=`<div class="warn">파일을 읽을 수 없습니다</div>`;}};
  $("#d_clr").onclick=()=>{if(confirm("정말 모든 데이터를 삭제할까요? 되돌릴 수 없습니다. (먼저 백업 권장)")){ST={sales:[],production:[],purchases:[],inspections:[],wastes:[],optionMap:{},reviews:[],recipes:JSON.parse(JSON.stringify(RECIPES_DEFAULT))};save();renderData();}};
}
// 초기화
load(); render();
</script>
</body>
</html>
